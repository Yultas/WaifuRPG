; Import manifest that rebuilds the hand-made pine forest from the Sprout Lands sheets.
; Used by tests/test_biome_import.gd; also an example of every manifest key.

[biome]
id = "pine_import"
display_name = "Хвойный лес (импорт)"
tile_size = 16
template = "res://data/biomes/pine_forest.tres"

[land]
texture = "res://tiles/Sprout Lands - Sorry pack/Early Access/Plant update 2/Ground tilesets/Grass_Tile_Layers.png"
; Rows 0-4 hold the same shapes with a dirt rim; this biome uses the plain ones below.
region = Rect2i(0, 5, 11, 20)
plain_variant_chance = 0.35

[road]
texture = "res://tiles/Sprout Lands - Sprites - Basic pack/Tilesets/Tilled_Dirt_Wide_v2.png"
plain_variant_chance = 0.3
lush = false

[hills]
texture = "res://tiles/generated/hills_spring.png"
stairs = Vector2i(9, 5)
face_depth = 0.5
plain_variant_chance = 0.2

[water]
texture = "res://tiles/Sprout Lands - Sprites - Basic pack/Tilesets/Water.png"

[bridge]
texture = "res://tiles/Sprout Lands - Sprites - Basic pack/Objects/Wood Bridge.png"

[props.pine]
texture = "res://tiles/Sprout Lands - Sorry pack/Early Access/Plant update 2/Pine Tree Biome.png"
names = {
"2,0": "weeds", "3,0": "fern", "7,0": "pine_huge",
"3,1": "pine_sapling", "4,1": "pine_tall", "5,1": "pine",
"3,2": "pine_shrub",
"0,3": "pine_bush", "1,3": "pine_bush_big", "2,3": "mushroom_brown",
"3,3": "pine_stump", "5,3": "pine_log", "6,3": "pine_log_long", "8,3": "pine_log_mossy"
}
skip = ["0,0", "1,0", "0,1", "1,1", "0,2", "1,2", "2,2"]
walkable = ["weeds", "fern", "mushroom_brown"]
blocking = ["pine_sapling"]
border = ["pine_huge", "pine", "pine_tall", "pine_bush_big"]
density = {"pine": 0.025, "pine_tall": 0.03, "weeds": 0.02, "fern": 0.025}
clustering = {"pine": 0.85, "fern": 0.5}
; The shrub's base is a thin stem, but its crown is what characters bump into.
collision = {"pine_shrub": Vector2(0.6, 0.4)}

[props.pine_water]
texture = "res://tiles/Sprout Lands - Sorry pack/Early Access/Plant update 2/Pine Tree Biome water plants.png"
placement = "water"
names = {"0,0": "reeds", "1,0": "reeds_tall", "2,0": "reeds_small", "4,0": "lily_small", "5,0": "lily", "6,0": "lily_wide", "7,0": "lily_flower"}
